name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  content-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every skill's frontmatter obeys the closed schema (name = directory,
      # required description/assumes, optional boundary fields, no unknown or
      # duplicate keys, NUL-safe). The selftest proves the checker still fails
      # on each drift class before the real run is trusted.
      - name: Frontmatter schema lint
        run: |
          bash scripts/check-frontmatter.sh --selftest
          bash scripts/check-frontmatter.sh

      # Skills must stay deployment-agnostic (no host bindings, no internal
      # milestone tags, no bare literal endpoints — a loopback URL may appear
      # only inside a ${...} deployment-override fallback). Read-only.
      - name: Project-agnostic content check
        run: |
          bash scripts/check-project-agnostic.sh --selftest
          bash scripts/check-project-agnostic.sh

      # No private-deployment vocabulary anywhere in the tree. NUL-safe
      # (reads raw bytes), covers every tracked file including itself.
      - name: Vocabulary denylist gate
        run: python3 scripts/check-denylist.py
